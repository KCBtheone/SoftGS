[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "softgs"
version = "0.1.0"
description = "Non-rigid editing of Gaussian splats from sparse control pairs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24,<2", "scipy>=1.10", "plyfile>=1.0"]

[project.optional-dependencies]
surface = ["open3d>=0.18,<0.20", "Pillow>=9"]

[project.scripts]
softgs = "softgs.cli:main"

[tool.setuptools.packages.find]
include = ["softgs"]
